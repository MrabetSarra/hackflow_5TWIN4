
name: HackFlow Django CI

on:
  push:
    branches:
      - main
      - gestion_evenements
  pull_request:
    branches:
      - main
      - gestion_evenements
  workflow_dispatch:

jobs:
  test:
    name: Django checks and tests
    runs-on: ubuntu-latest

    env:
      DJANGO_SECRET_KEY: test-only-secret-key-for-ci
      DJANGO_DEBUG: "True"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Check for unresolved merge conflicts
        shell: bash
        run: |
          if grep -RInE '^(<<<<<<< |=======$|>>>>>>> )' \
            --include='*.py' \
            --include='*.html' \
            --include='*.txt' \
            --include='*.gitignore' \
            --exclude-dir=.git \
            --exclude-dir=.venv \
            --exclude-dir=venv .; then
            echo "Unresolved Git conflict markers detected."
            exit 1
          fi

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Django configuration
        run: python manage.py check

      - name: Check migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Run Django tests
        run: python manage.py test
