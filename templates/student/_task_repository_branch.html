{% load i18n %}
{% if task.repository_branch and task.repository %}<div class="mb-2"><a class="badge bg-primary-subtle text-primary text-decoration-none" href="{% url 'repositories:detail' task.repository.slug %}?branch={{ task.repository_branch|urlencode }}"><i aria-hidden="true" class="bi bi-git me-1"></i>{{ task.repository_branch }}</a></div>{% elif repositories %}<form method="post" class="d-flex flex-wrap gap-2 align-items-center mb-2">{% csrf_token %}<input type="hidden" name="action" value="create_task_branch"><input type="hidden" name="task_id" value="{{ task.id }}"><select class="form-select form-select-sm flex-grow-1" name="repository_id" aria-label="Repository for task branch">{% for repository in repositories %}<option value="{{ repository.pk }}">{{ repository.name }}</option>{% endfor %}</select><button class="btn btn-primary btn-sm rounded-pill px-3 text-nowrap flex-shrink-0" type="submit"><i aria-hidden="true" class="bi bi-diagram-2 me-1"></i>{% trans "Create branch" %}</button></form>{% endif %}
