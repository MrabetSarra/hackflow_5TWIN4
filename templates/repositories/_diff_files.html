{% load i18n %}
{% for file in diff_files %}
<details class="repository-diff-file mb-2" open>
    <summary>
        <i aria-hidden="true" class="bi bi-file-earmark-diff me-1"></i>
        <code>{{ file.path }}</code>
    </summary>
    <pre class="repository-diff mb-0 p-2">{{ file.html|safe }}</pre>
</details>
{% empty %}
<div class="text-center py-4">
    <span class="text-body-secondary small"><i aria-hidden="true" class="bi bi-check2-circle text-success me-1"></i>{% trans "No file changes to display." %}</span>
</div>
{% endfor %}
