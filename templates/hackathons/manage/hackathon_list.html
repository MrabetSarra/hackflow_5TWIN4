<div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3 mb-4">
    <div>
        <h1 class="h2 fw-bold mb-1">Hackathons</h1>
        <p class="text-body-secondary mb-0">Créez vos hackathons, leurs challenges et gérez leur publication.</p>
    </div>
    <a href="{% url 'hackathons:hackathon_create' %}" class="btn btn-primary rounded-pill px-4"><i class="bi bi-plus-lg me-1"></i>Nouveau hackathon</a>
</div>

<form method="get" class="card-modern p-4 mb-5 row g-3 align-items-end">
    <div class="col-md-4"><label class="form-label small fw-semibold" for="q">Recherche</label><input class="form-control" id="q" name="q" value="{{ q }}" placeholder="Titre ou track"></div>
    <div class="col-md-3"><label class="form-label small fw-semibold" for="track">Track</label>
        <select class="form-select" id="track" name="track"><option value="">Tous</option>{% for t in tracks %}<option value="{{ t.pk }}" {% if track == t.pk|stringformat:'s' %}selected{% endif %}>{{ t.name }}</option>{% endfor %}</select></div>
    <div class="col-md-2"><label class="form-label small fw-semibold" for="status">Publication</label>
        <select class="form-select" id="status" name="status"><option value="">Tous</option>{% for v, l in statuses %}<option value="{{ v }}" {% if v == status %}selected{% endif %}>{{ l }}</option>{% endfor %}</select></div>
    <div class="col-md-2"><label class="form-label small fw-semibold" for="phase">Période</label>
        <select class="form-select" id="phase" name="phase"><option value="">Toutes</option><option value="upcoming" {% if phase == 'upcoming' %}selected{% endif %}>À venir</option><option value="ongoing" {% if phase == 'ongoing' %}selected{% endif %}>En cours</option><option value="finished" {% if phase == 'finished' %}selected{% endif %}>Terminés</option></select></div>
    <div class="col-md-1"><button class="btn btn-primary w-100" aria-label="Filtrer"><i class="bi bi-funnel"></i></button></div>
</form>

<div class="row g-4">
    {% for hh in hackathons %}<div class="col-md-6 col-xl-4">{% include "hackathons/_hackathon_card.html" with h=hh manage=True %}</div>
    {% empty %}<div class="col-12"><div class="card-modern p-5 text-center text-body-secondary"><i class="bi bi-trophy fs-1 d-block mb-3"></i>Aucun hackathon pour le moment.</div></div>{% endfor %}
</div>
