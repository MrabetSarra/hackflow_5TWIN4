{% if page.has_other_pages %}
<nav class="mt-4" aria-label="Pagination">
    <ul class="pagination justify-content-center">
        {% if page.has_previous %}
        <li class="page-item"><a class="page-link" href="?{% if query_string %}{{ query_string }}&amp;{% endif %}page={{ page.previous_page_number }}">Précédent</a></li>
        {% endif %}
        <li class="page-item active" aria-current="page"><span class="page-link">Page {{ page.number }} / {{ page.paginator.num_pages }}</span></li>
        {% if page.has_next %}
        <li class="page-item"><a class="page-link" href="?{% if query_string %}{{ query_string }}&amp;{% endif %}page={{ page.next_page_number }}">Suivant</a></li>
        {% endif %}
    </ul>
</nav>
{% endif %}
