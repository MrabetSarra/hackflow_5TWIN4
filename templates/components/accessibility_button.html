{% load i18n %}
<div class="a11y-widget" id="displayOptionsWidget">
  <section class="a11y-panel" id="displayOptionsPanel" aria-labelledby="a11yTitle" hidden>
    <header class="a11y-panel-header">
      <span class="a11y-panel-mark" aria-hidden="true"><i class="bi bi-universal-access"></i></span>
      <h2 id="a11yTitle">{% trans "Display & reading" %}</h2>
      <button class="a11y-close" type="button" data-a11y-close aria-label="{% trans 'Close display and reading options' %}">
        <i class="bi bi-x-lg" aria-hidden="true"></i>
      </button>
    </header>

    <div class="a11y-size-section">
      <div class="a11y-section-label" id="a11yTextSizeLabel">{% trans "Text size" %}</div>
      <div class="a11y-size-control" role="group" aria-labelledby="a11yTextSizeLabel">
        <button class="a11y-size-button" type="button" data-a11y-size="-1" aria-label="{% trans 'Decrease text size' %}">A<span>−</span></button>
        <button class="a11y-size-button" type="button" data-a11y-size="0" aria-label="{% trans 'Reset text size' %}">A</button>
        <button class="a11y-size-button" type="button" data-a11y-size="1" aria-label="{% trans 'Increase text size' %}">A<span>+</span></button>
      </div>
    </div>

    <div class="a11y-options-grid">
      <button class="a11y-option" type="button" id="a11yContrast" aria-pressed="false"><i class="bi bi-circle-half" aria-hidden="true"></i><span>{% trans "High contrast" %}</span><i class="bi bi-check2 a11y-option-check" aria-hidden="true"></i></button>
      <button class="a11y-option" type="button" id="a11ySpacing" aria-pressed="false"><i class="bi bi-text-paragraph" aria-hidden="true"></i><span>{% trans "More line spacing" %}</span><i class="bi bi-check2 a11y-option-check" aria-hidden="true"></i></button>
      <button class="a11y-option" type="button" id="a11yLinks" aria-pressed="false"><i class="bi bi-link-45deg" aria-hidden="true"></i><span>{% trans "Underline links" %}</span><i class="bi bi-check2 a11y-option-check" aria-hidden="true"></i></button>
      <button class="a11y-option" type="button" id="a11yFont" aria-pressed="false"><i class="bi bi-type" aria-hidden="true"></i><span>{% trans "Simple reading font" %}</span><i class="bi bi-check2 a11y-option-check" aria-hidden="true"></i></button>
      <button class="a11y-option" type="button" id="a11yMotion" aria-pressed="false"><i class="bi bi-pause-circle" aria-hidden="true"></i><span>{% trans "Reduce motion" %}</span><i class="bi bi-check2 a11y-option-check" aria-hidden="true"></i></button>
      <button class="a11y-option" type="button" id="a11yFocus" aria-pressed="false"><i class="bi bi-bullseye" aria-hidden="true"></i><span>{% trans "Strong keyboard focus" %}</span><i class="bi bi-check2 a11y-option-check" aria-hidden="true"></i></button>
      <button class="a11y-option" type="button" id="a11yAlign" aria-pressed="false"><i class="bi bi-text-left" aria-hidden="true"></i><span>{% trans "Align text left" %}</span><i class="bi bi-check2 a11y-option-check" aria-hidden="true"></i></button>
      <button class="a11y-option" type="button" id="a11yHeadings" aria-pressed="false"><i class="bi bi-highlighter" aria-hidden="true"></i><span>{% trans "Highlight headings" %}</span><i class="bi bi-check2 a11y-option-check" aria-hidden="true"></i></button>
    </div>

    <footer class="a11y-panel-footer">
      <button class="a11y-reset" type="button" id="a11yReset"><i class="bi bi-arrow-counterclockwise" aria-hidden="true"></i>{% trans "Reset display settings" %}</button>
      <p><i class="bi bi-shield-check" aria-hidden="true"></i>{% trans "Your preferences are saved on this device." %}</p>
    </footer>
  </section>
  <button class="btn btn-primary a11y-trigger" id="displayOptionsToggle" type="button" aria-expanded="false" aria-controls="displayOptionsPanel" aria-label="{% trans 'Open display and reading options' %}" data-label-open="{% trans 'Open display and reading options' %}" data-label-close="{% trans 'Close display and reading options' %}">
    <i class="bi bi-person-standing" aria-hidden="true"></i>
  </button>
</div>
