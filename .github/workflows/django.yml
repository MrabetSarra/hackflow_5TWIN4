
name: HackFlow Django CI

on:
  push:
    branches:
      - main
      - gestion_evenements
      - student
      - 'feature/**'

  pull_request:
    branches:
      - main
      - gestion_evenements
      - student
      - 'feature/**'

  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Django checks and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      DJANGO_SECRET_KEY: test-only-secret-key-for-ci-must-be-at-least-50-characters-long
      DJANGO_DEBUG: "True"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,testserver

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Check for unresolved merge conflicts
        shell: bash
        run: |
          if grep -RInE '^(<<<<<<< |=======$|>>>>>>> )' \
            --include='*.py' \
            --include='*.html' \
            --include='*.yml' \
            --include='*.yaml' \
            --include='*.sh' \
            --include='*.txt' \
            --include='*.gitignore' \
            --exclude-dir=.git \
            --exclude-dir=.venv \
            --exclude-dir=venv \
            --exclude-dir=node_modules \
            .; then
            echo "Unresolved Git conflict markers detected."
            exit 1
          fi

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Check Django configuration
        run: python manage.py check

      - name: Check migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Run Django tests
        run: |
          coverage run manage.py test 2>&1 | tee test-output.txt

      - name: Export Cobertura coverage report
        if: always()
        run: |
          coverage xml -o coverage.xml

      - name: Report coverage (minimum 80%)
        if: success()
        run: |
          coverage report --fail-under=80 | tee coverage-report.txt

      - name: Write test and coverage summary
        if: always()
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          test_path = Path("test-output.txt")
          report_path = Path("coverage-report.txt")

          test_output = (
              test_path.read_text(encoding="utf-8", errors="replace")
              if test_path.exists() else ""
          )
          report = (
              report_path.read_text(encoding="utf-8", errors="replace")
              if report_path.exists() else ""
          )

          match = re.search(r"Ran\s+(\d+)\s+tests?", test_output)
          total_line = next(
              (line for line in reversed(report.splitlines())
               if line.strip().startswith("TOTAL ")),
              ""
          )

          tests = match.group(1) if match else "unavailable"
          coverage = total_line.split()[-1] if total_line else "unavailable"

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("## HackFlow Django CI summary\n\n")
              summary.write(f"- Tests run: {tests}\n")
              summary.write(f"- Coverage: {coverage}\n")
          PY

      - name: Check production security settings
        env:
          DJANGO_DEBUG: "False"
          DJANGO_SECRET_KEY: ci-only-random-test-key-9f2a7c1e5b8d3a6f0c4e9b2d7a1c5f8e6d0b3a9c4f2e7d1
          DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,testserver

          # Database dedicated to the CI security check.
          # Never use production database credentials here.
          DATABASE_URL: sqlite:///ci-deploy-check.sqlite3

          SECURE_SSL_REDIRECT: "true"
          SESSION_COOKIE_SECURE: "true"
          CSRF_COOKIE_SECURE: "true"
          SECURE_HSTS_SECONDS: "31536000"
          SECURE_HSTS_INCLUDE_SUBDOMAINS: "true"
          SECURE_HSTS_PRELOAD: "false"
          SECURE_CONTENT_TYPE_NOSNIFF: "true"
          X_FRAME_OPTIONS: DENY
          SECURE_PROXY_SSL_HEADER: HTTP_X_FORWARDED_PROTO,https
        run: python manage.py check --deploy

      - name: Build HTML coverage report
        if: always()
        run: |
          if [ -f .coverage ]; then
            coverage html
          else
            echo "Coverage data is unavailable."
          fi

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hackflow-coverage-reports
          path: |
            htmlcov/
            coverage.xml
            test-output.txt
            coverage-report.txt
          if-no-files-found: warn
          retention-days: 7

  deploy:
    name: Deploy to Render
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate deployment configuration
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          SITE_URL: ${{ secrets.SITE_URL }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${RENDER_DEPLOY_HOOK_URL:-}" ]]; then
            echo "Missing RENDER_DEPLOY_HOOK_URL in production environment secrets."
            exit 1
          fi

          if [[ -z "${SITE_URL:-}" ]]; then
            echo "Missing SITE_URL in production environment secrets."
            exit 1
          fi

      - name: Trigger Render deployment
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        shell: bash
        run: |
          set -euo pipefail

          curl --fail --silent --show-error \
            --request POST \
            --max-time 20 \
            --output /dev/null \
            "$RENDER_DEPLOY_HOOK_URL"

          echo "Render deployment hook triggered."

      - name: Wait for Render health check
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
        shell: bash
        run: |
          set -euo pipefail

          base_url="${SITE_URL%/}"
          deadline=$(( $(date +%s) + 300 ))
          healthy=0

          while (( $(date +%s) < deadline )); do
            if curl --fail --silent --show-error \
              --connect-timeout 3 \
              --max-time 5 \
              --output /dev/null \
              "$base_url/healthz/"; then
              healthy=1
              echo "Health check passed."
              break
            fi

            echo "Waiting for Render service..."
            sleep 5
          done

          if (( healthy == 0 )); then
            echo "Health check failed: /healthz/ did not return HTTP 200 within five minutes."
            exit 1
          fi

      - name: Run smoke tests
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
        shell: bash
        run: |
          set -euo pipefail
          sh scripts/smoke_test.sh "${SITE_URL%/}"
