<div class="mb-3">
    <label for="{{ field.id_for_label }}" class="form-label small fw-semibold">{{ field.label }}{% if field.field.required %} <span class="text-danger" aria-hidden="true">*</span>{% endif %}</label>
    {{ field }}
    {% if field.help_text %}<div class="form-text">{{ field.help_text }}</div>{% endif %}
    {% for error in field.errors %}<div id="{{ field.id_for_label }}_errors" class="text-danger small mt-1">{{ error }}</div>{% endfor %}
</div>
