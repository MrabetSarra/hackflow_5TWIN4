
sonar.projectKey=HackFlow
sonar.projectName=HackFlow
sonar.projectDescription=Plateforme Django de gestion de hackathons, projets et opportunités de carrière
sonar.sourceEncoding=UTF-8

# Code source Python
sonar.sources=accounts,career_opportunities,core,dashboard_admin,hackflow,mentor,repositories,student

# Tests Python
sonar.tests=.
sonar.test.inclusions=**/tests.py,**/test_*.py,**/tests_*.py

# Exclusions : environnements, fichiers générés et migrations
sonar.exclusions=**/.venv/**,**/venv/**,**/migrations/**,**/management/commands/**,**/staticfiles/**,**/media/**,**/private_media/**,**/node_modules/**,**/__pycache__/**,**/docker-data/**,**/.repository-data/**

# Ne pas compter les tests dans les métriques de couverture
sonar.coverage.exclusions=**/tests.py,**/test_*.py,**/tests_*.py

# Rapport de couverture Python produit par Coverage.py
sonar.python.coverage.reportPaths=coverage.xml
