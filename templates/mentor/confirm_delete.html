{% extends "layouts/base_mentor.html" %}

{% block title %}Confirmer la suppression - Espace Mentor - HackFlow{% endblock %}

{% block mentor_content %}
<div class="container-fluid px-0" style="max-width: 640px;">
    <section class="card-modern p-4 border-danger-subtle" aria-labelledby="confirm-title">
        <h1 id="confirm-title" class="h4 fw-bold text-body mb-3"><i class="bi bi-exclamation-triangle-fill text-danger me-2" aria-hidden="true"></i>Confirmer la suppression</h1>
        <p class="mb-4">Voulez-vous vraiment supprimer {{ object_label }} ? Cette action est définitive.</p>
        <form method="post" class="d-flex gap-2 justify-content-end">
            {% csrf_token %}
            <a href="{{ cancel_url }}" class="btn btn-light border">Annuler</a>
            <button type="submit" class="btn btn-danger">Supprimer définitivement</button>
        </form>
    </section>
</div>
{% endblock %}
