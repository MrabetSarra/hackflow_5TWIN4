{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}HackFlow - Plateforme de Hackathon Étudiant{% endblock %}</title>
    
    <!-- Meta SEO & Icons -->
    <meta name="description" content="Plateforme collaborative de gestion de hackathon étudiant : matching, gestion d'équipe, mentorat et suivi de projet.">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="HackFlow">
    <meta property="og:title" content="HackFlow - Build · Collaborate · Create">
    <meta property="og:description" content="La plateforme collaborative de gestion de hackathon étudiant.">
    <meta property="og:image" content="{{ request.scheme }}://{{ request.get_host }}{% static 'images/hackflow-thumbnail.png' %}">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:image" content="{{ request.scheme }}://{{ request.get_host }}{% static 'images/hackflow-thumbnail.png' %}">
    <link rel="icon" type="image/png" href="{% static 'images/hackflow-mark.png' %}">

    <!-- Pre-init Theme (Dark / Light) pour éviter tout scintillement -->
    <script>
        (function() {
            const savedTheme = localStorage.getItem('hackflow-theme') || 
                (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
            document.documentElement.setAttribute('data-bs-theme', savedTheme);
        })();
    </script>

    <!-- Google Fonts Premium : Plus Jakarta Sans & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400;1,600&display=swap" rel="stylesheet">

    <!-- Bootstrap 5.3 & Icons CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <!-- HackFlow Custom CSS -->
    <link rel="stylesheet" href="{% static 'css/custom.css' %}?v=display-controls-3">
    
    {% block extra_css %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">

    <a class="visually-hidden-focusable" href="#main-content">Skip to main content</a>

    {% block layout %}{% endblock %}

    {% include "components/accessibility_button.html" %}

    <!-- Bootstrap 5.3 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    
    <!-- HackFlow Custom JS -->
    <script src="{% static 'js/main.js' %}?v=display-controls-3"></script>
    
    {% block extra_js %}{% endblock %}
</body>
</html>
